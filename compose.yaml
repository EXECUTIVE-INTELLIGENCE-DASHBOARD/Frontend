services:
  frontend:
    build:
      # The repo-root `Dockerfile` is the production image; the dev container
      # runs the Vite dev server so this compose file keeps hot reload.
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:

