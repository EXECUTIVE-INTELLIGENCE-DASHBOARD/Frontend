
name: Build and Deploy Frontend Image

on:
  push:
    branches:
      - Dev
    paths:
      - "**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/executive-intelligence-dashboard/frontend:dev
            ghcr.io/executive-intelligence-dashboard/frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushing a new tag to GHCR does not touch the droplet: the running
      # container keeps serving the old image until it is replaced. This step
      # pulls the fresh tag over SSH and recreates the container, and needs
      # these repository secrets:
      #   DROPLET_HOST      droplet address
      #   DROPLET_USER      a user allowed to run docker
      #   DROPLET_SSH_KEY   private key for that user
      # Without them the step fails rather than deploying a stale image.
      - name: Deploy frontend to DigitalOcean Droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" \
            'set -e
             docker pull ghcr.io/executive-intelligence-dashboard/frontend:dev
             docker rm -f greenhill-frontend >/dev/null 2>&1 || true
             docker run -d \
               --name greenhill-frontend \
               --network greenhill-net \
               --restart unless-stopped \
               -p 127.0.0.1:8080:8080 \
               -e API_UPSTREAM=http://deploy-api-1:8000 \
               ghcr.io/executive-intelligence-dashboard/frontend:dev'


